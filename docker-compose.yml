# Local stack: API + Prometheus + Grafana.   docker compose up -d --build
services:
  api:
    build: .
    image: heart-risk-api:1.0.0
    container_name: heart-risk-api
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: heart-risk-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.2.2
    container_name: heart-risk-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/heart-risk.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]
