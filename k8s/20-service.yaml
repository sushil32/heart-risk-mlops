# LoadBalancer: on Docker Desktop this is published on http://localhost:8080
apiVersion: v1
kind: Service
metadata:
  name: heart-risk-api
  namespace: heart-risk
  labels:
    app: heart-risk-api
spec:
  type: LoadBalancer
  selector:
    app: heart-risk-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: heart-risk-api
  namespace: heart-risk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: heart-risk-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
